version: 2
updates:
  # The python base image is pinned by digest: propose the patch releases
  # of the same minor version, a new minor version is a deliberate change.
  - package-ecosystem: docker
    directories:
      - /
      - /.devcontainer
    schedule:
      interval: weekly
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: vscode/devcontainers/python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
