name: 'Build CraftBeerPi4'

on:
  push:
    branches:
      - main
      - master
      - development
  pull_request:
  workflow_dispatch:

# A new push to a pull request cancels the run of the previous one.
# Branch builds are never cancelled, so every published image is complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/craftbeerpi4

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    name: Builds the source distribution package
    outputs:
      image: ${{ steps.prep.outputs.image }}
      tags: ${{ steps.prep.outputs.tags }}
      publish_image: ${{ steps.prep.outputs.publish_image }}
      ui_ref: ${{ steps.prep.outputs.ui_ref }}
    steps:

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.14.8'
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            setup.py

      - name: Install packages
        run: sudo apt-get install -y --no-install-recommends libsystemd-dev

      - name: Install setuptools
        run: pip3 install setuptools --upgrade

      - name: Clean
        run: python setup.py clean --all

      - name: Install Requirements
        run: pip3 install -r requirements-dev.txt

      - name: Run tests
        run: coverage run --source cbpi -m pytest tests

      - name: Build source distribution package for CraftBeerPi
        run: python setup.py sdist

      # Catches a broken package (missing files, bad dependency, setup crash)
      # in seconds, instead of waiting for the docker build to hit it.
      - name: Install the package in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install dist/cbpi4-*.tar.gz
          cd "$(mktemp -d)"
          "$RUNNER_TEMP/venv/bin/cbpi" setup
          test -f config/config.json

      - name: Upload CraftBeerPi package to be used in next step
        uses: actions/upload-artifact@v4
        with:
          name: craftbeerpi4
          path: dist/cbpi4-*.tar.gz
          if-no-files-found: error

      - name: Prepare docker image and tag names
        id: prep
        run: |

          IMAGE_NAME_LOWERCASE=${IMAGE_NAME,,}
          echo "Using image name $IMAGE_NAME_LOWERCASE"

          PUBLISH_IMAGE=false
          TAGS="$IMAGE_NAME_LOWERCASE:dev"

          if [[ $GITHUB_EVENT_NAME == push ]]; then
            if [[ $GITHUB_REF_NAME == master ]] || [[ $GITHUB_REF_NAME == main ]]; then
              # when building master/main use :latest tag and the version number
              # from the cbpi/__init__.py file
              VERSION=$(grep -o -E "(([0-9]{1,2}[.]?){2,3}[0-9]+)" cbpi/__init__.py)
              TAGS="$IMAGE_NAME_LOWERCASE:latest,$IMAGE_NAME_LOWERCASE:v${VERSION}"
              PUBLISH_IMAGE="true"
            elif [[ $GITHUB_REF_NAME == development ]]; then
              PUBLISH_IMAGE="true"
            fi
          fi

          # master/main ship the released UI, every other build (the :dev
          # image, pull requests) the UI of the development branch
          TARGET_BRANCH=${GITHUB_BASE_REF:-$GITHUB_REF_NAME}
          if [[ $TARGET_BRANCH == master ]] || [[ $TARGET_BRANCH == main ]]; then
            UI_REF=main
          else
            UI_REF=development
          fi

          echo "tags: $TAGS"
          echo "publish_image: $PUBLISH_IMAGE"
          echo "ui_ref: $UI_REF"
          echo "image=$IMAGE_NAME_LOWERCASE" >> "$GITHUB_OUTPUT"
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "publish_image=$PUBLISH_IMAGE" >> "$GITHUB_OUTPUT"
          echo "ui_ref=$UI_REF" >> "$GITHUB_OUTPUT"

  # Each platform builds on a native runner: emulating arm64 with QEMU made
  # a build without cache take 14 minutes, most of it in pip install.
  docker:
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    name: Builds the docker image (${{ matrix.platform }})
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare platform name
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: needs.build.outputs.publish_image == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pull requests only build. Published builds push the image by digest,
      # the merge job then tags both platforms as one multi-arch image.
      - name: Build
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          target: deploy
          build-args: CBPI_UI_REF=${{ needs.build.outputs.ui_ref }}
          outputs: ${{ needs.build.outputs.publish_image == 'true' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', needs.build.outputs.image) || 'type=cacheonly' }}
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}
          labels: |
            org.opencontainers.image.title=${{ github.event.repository.name }}
            org.opencontainers.image.description=${{ github.event.repository.description }}
            org.opencontainers.image.url=${{ github.event.repository.html_url }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Export digest
        if: needs.build.outputs.publish_image == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"

      - name: Upload digest
        if: needs.build.outputs.publish_image == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [build, docker]
    if: needs.build.outputs.publish_image == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      packages: write
    name: Publishes the multi-arch docker image
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          TAGS: ${{ needs.build.outputs.tags }}
        run: |
          tag_args=()
          for tag in ${TAGS//,/ }; do
            tag_args+=(-t "$tag")
          done
          docker buildx imagetools create "${tag_args[@]}" \
            $(printf "$IMAGE@sha256:%s " *)

      - name: Inspect image
        env:
          TAGS: ${{ needs.build.outputs.tags }}
        run: docker buildx imagetools inspect "${TAGS%%,*}"
